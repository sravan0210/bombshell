<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Notes • Compliment Meter</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Canvas Confetti & Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Romantic Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            script: ['"Great Vibes"', 'cursive']
          },
          colors: {
            love: {
              50: '#fff1f2',
              100: '#ffe4e6',
              200: '#fecdd3',
              300: '#fda4af',
              400: '#fb7185',
              500: '#f43f5e',
              600: '#e11d48',
              700: '#be123c',
              800: '#9f1239',
              900: '#881337',
              950: '#4c0519'
            }
          },
          animation: {
            'heartbeat': 'heartbeat 2s ease-in-out infinite',
            'float-slow': 'float 5s ease-in-out infinite',
            'pulse-soft': 'pulseSoft 3s ease-in-out infinite'
          },
          keyframes: {
            heartbeat: {
              '0%, 100%': { transform: 'scale(1)' },
              '14%': { transform: 'scale(1.08)' },
              '28%': { transform: 'scale(1)' },
              '42%': { transform: 'scale(1.06)' },
              '70%': { transform: 'scale(1)' }
            },
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-6px)' }
            },
            pulseSoft: {
              '0%, 100%': { opacity: '0.4' },
              '50%': { opacity: '0.75' }
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Romantic Frosted Glass */
    .love-glass {
      background: linear-gradient(135deg, rgba(20, 15, 25, 0.75) 0%, rgba(35, 15, 25, 0.65) 100%);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8),
                  0 0 35px 0 rgba(225, 29, 72, 0.15),
                  inset 0 1px 1px 0 rgba(255, 255, 255, 0.15);
    }

    .love-input {
      background: rgba(25, 20, 30, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(244, 114, 182, 0.25);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
    }
    .love-input:focus {
      background: rgba(30, 22, 36, 0.95);
      border-color: rgba(236, 72, 153, 0.6);
      box-shadow: 0 0 25px -4px rgba(236, 72, 153, 0.3),
                  inset 0 1px 4px rgba(0, 0, 0, 0.4);
    }

    /* Soft Glows */
    .portrait-halo {
      box-shadow: 0 12px 35px -8px rgba(168, 85, 247, 0.35),
                  0 0 25px 2px rgba(244, 63, 94, 0.2);
    }
    .heart-glow {
      filter: drop-shadow(0 0 18px rgba(244, 63, 94, 0.45));
    }
    .counter-glow {
      text-shadow: 0 4px 15px rgba(225, 29, 72, 0.25);
    }

    /* Circular SVG Gauge */
    .progress-circle {
      transition: stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
  </style>
</head>
<body class="min-h-screen bg-black text-slate-100 font-sans flex flex-col justify-between items-center relative overflow-x-hidden p-4 sm:p-6 antialiased select-none">

  <!-- Floating Heart Canvas -->
  <canvas id="heart-canvas" class="fixed inset-0 pointer-events-none -z-20 w-full h-full"></canvas>

  <!-- Ambient Romantic Blobs -->
  <div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
    <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-96 h-96 bg-purple-900/30 rounded-full blur-3xl animate-pulse-soft"></div>
    <div class="absolute bottom-0 -left-20 w-80 h-80 bg-rose-950/40 rounded-full blur-3xl animate-pulse-soft" style="animation-delay: 1.5s;"></div>
    <div class="absolute top-1/3 -right-20 w-80 h-80 bg-pink-950/30 rounded-full blur-3xl animate-pulse-soft" style="animation-delay: 2.5s;"></div>
  </div>

  <!-- Romantic Header -->
  <header class="w-full max-w-md mx-auto pt-2 text-center">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/10 border border-white/15 shadow-sm mb-1.5 backdrop-blur-sm">
      <i data-lucide="heart" class="w-3.5 h-3.5 text-rose-400 fill-rose-400 animate-pulse"></i>
      <span class="text-xs font-semibold text-rose-300 tracking-wider uppercase">Send Love</span>
    </div>
    <h1 class="text-4xl sm:text-5xl font-script text-rose-400 tracking-wide font-normal">
      Compliments For You
    </h1>
    <p class="text-xs sm:text-sm text-pink-200/60 mt-0.5 font-light">
      Leave sweet words and fill the heart meter.
    </p>
  </header>

  <!-- Main Card Container -->
  <main class="w-full max-w-md mx-auto my-auto py-3">
    <div class="love-glass rounded-3xl p-5 sm:p-7 relative flex flex-col items-center">
      
      <!-- PORTRAIT SHOWCASE -->
      <div class="relative mb-3">
        <!-- Soft glowing halo around photo -->
        <div class="absolute -inset-2 rounded-3xl bg-gradient-to-tr from-purple-400 via-pink-400 to-rose-400 opacity-60 blur-lg animate-pulse-soft"></div>
        
        <div class="relative w-44 sm:w-52 max-h-72 aspect-[3/4] rounded-2xl p-[3px] bg-gradient-to-tr from-purple-300 via-rose-300 to-pink-200 shadow-xl overflow-hidden flex items-center justify-center">
          <img
            id="portrait-img"
            src="885090237_1658285919239612_6308573982085430398_n_2.jpg"
            alt="Her Portrait"
            class="w-full h-full object-cover object-center rounded-[13px] portrait-halo"
          />
        </div>

        <!-- Decorative love badge on portrait -->
        <div class="absolute -bottom-2 -right-2 bg-white/95 p-2 rounded-full shadow-lg border border-rose-100 flex items-center justify-center text-rose-500">
          <i data-lucide="sparkles" class="w-4 h-4 text-purple-600 fill-purple-200"></i>
        </div>
      </div>

      <!-- COMPLIMENT METER -->
      <div class="flex flex-col items-center justify-center my-1 w-full">
        <div class="relative w-40 h-40 flex items-center justify-center">
          
          <!-- Outer Pulsing Glow -->
          <div class="absolute inset-3 rounded-full bg-rose-300/25 blur-lg animate-pulse-soft"></div>

          <!-- Circular Progress Ring -->
          <svg class="w-full h-full" viewBox="0 0 160 160">
            <circle
              cx="80" cy="80" r="66"
              fill="none"
              stroke="rgba(244, 63, 94, 0.12)"
              stroke-width="7"
            />
            <circle
              id="progress-circle"
              class="progress-circle"
              cx="80" cy="80" r="66"
              fill="none"
              stroke="url(#loveGradient)"
              stroke-width="8"
              stroke-linecap="round"
              stroke-dasharray="415"
              stroke-dashoffset="415"
            />
            <defs>
              <linearGradient id="loveGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#c084fc" />
                <stop offset="50%" stop-color="#f43f5e" />
                <stop offset="100%" stop-color="#fb7185" />
              </linearGradient>
            </defs>
          </svg>

          <!-- Heart Center with Counter -->
          <div class="absolute flex flex-col items-center justify-center text-center">
            <div class="relative flex items-center justify-center mb-0.5">
              <i data-lucide="heart" class="w-11 h-11 text-rose-500 fill-rose-500/20 heart-glow animate-heartbeat"></i>
            </div>
            <div id="counter-value" class="text-3xl font-bold font-sans text-rose-300 counter-glow transition-transform duration-200">
              0
            </div>
            <span class="text-[10px] font-medium tracking-wide text-rose-300/80 uppercase">
              Compliments
            </span>
          </div>

        </div>
      </div>

      <!-- INPUT BOX -->
      <div class="mt-2 w-full flex flex-col gap-2.5">
        <div class="relative">
          <textarea
            id="compliment-text"
            rows="3"
            maxlength="200"
            class="love-input w-full p-3.5 rounded-2xl text-white font-semibold placeholder:font-normal placeholder-rose-300/40 text-sm focus:outline-none transition-all duration-200 leading-relaxed resize-none"
            placeholder="Write your sweet words here..."
          ></textarea>
          
          <div class="absolute bottom-2.5 right-3.5 text-[10px] text-rose-300/60 font-medium">
            <span id="char-counter">0</span>/200
          </div>
        </div>

        <!-- Validation message -->
        <div id="toast-banner" class="text-xs font-medium text-rose-400 text-center min-h-[16px] transition-opacity duration-200 opacity-0">
          Please write a compliment first!
        </div>

        <!-- BUTTONS -->
        <div class="flex items-center gap-2.5">
          
          <!-- Send Compliment Button -->
          <button
            type="button"
            onclick="handleSendCompliment()"
            class="flex-1 py-3 px-5 rounded-2xl font-semibold text-white shadow-lg shadow-rose-900/40 active:scale-[0.98] transition-all duration-200 bg-gradient-to-r from-rose-500 via-pink-500 to-purple-600 hover:from-rose-600 hover:to-purple-700 flex items-center justify-center gap-2 text-sm"
          >
            <i data-lucide="heart" class="w-4 h-4 fill-white"></i>
            <span>Send Compliment</span>
          </button>

          <!-- Reset Button -->
          <button
            type="button"
            onclick="confirmResetMeter()"
            class="p-3 rounded-2xl bg-white/10 border border-white/10 text-rose-300 hover:text-white hover:bg-white/20 transition-all duration-200 active:scale-95 flex items-center justify-center shadow-sm"
            title="Reset count to 0"
          >
            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
          </button>
        </div>

      </div>

      <!-- ALL COMPLIMENTS LIST SECTION -->
      <div class="w-full mt-6 pt-5 border-t border-white/10">
        <div class="flex items-center justify-between mb-3 px-1">
          <div class="flex items-center gap-2">
            <i data-lucide="message-circle-heart" class="w-4 h-4 text-rose-400"></i>
            <h3 class="text-xs font-semibold uppercase tracking-wider text-rose-200/80">
              All Compliments (<span id="compliment-list-count">0</span>)
            </h3>
          </div>
        </div>

        <!-- Scrollable list of comments -->
        <div id="compliments-container" class="max-h-56 overflow-y-auto pr-1 space-y-2.5">
          <!-- Comments will render dynamically here -->
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full text-center py-3 text-xs text-rose-200/30">
    Made with love • Count stays saved
  </footer>

  <!-- Logic & Heart Particle Animations -->
  <script>
    // Lucide Icons
    lucide.createIcons();

    // Local Storage Configuration
    const STORAGE_KEY = 'love_compliment_count';
    const COMMENTS_STORAGE_KEY = 'love_compliments_list';
    const CIRCUMFERENCE = 2 * Math.PI * 66; // r=66 (~414.69)
    let count = 0;
    let compliments = [];

    // DOM Elements
    const counterValueEl = document.getElementById('counter-value');
    const progressCircle = document.getElementById('progress-circle');
    const complimentText = document.getElementById('compliment-text');
    const charCounter = document.getElementById('char-counter');
    const toastBanner = document.getElementById('toast-banner');
    const complimentsContainer = document.getElementById('compliments-container');
    const complimentListCount = document.getElementById('compliment-list-count');

    // 1. Load Count & Comments
    function loadData() {
      // Load count
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored !== null && !isNaN(parseInt(stored, 10))) {
        count = Math.max(0, parseInt(stored, 10));
      } else {
        count = 0;
      }
      updateDisplay(count, false);

      // Load compliments
      try {
        const storedComments = localStorage.getItem(COMMENTS_STORAGE_KEY);
        compliments = storedComments ? JSON.parse(storedComments) : [];
      } catch (e) {
        compliments = [];
      }
      renderCompliments();
    }

    // Render compliments list
    function renderCompliments() {
      complimentListCount.textContent = compliments.length;

      if (compliments.length === 0) {
        complimentsContainer.innerHTML = `
          <div class="text-center py-5 text-xs text-rose-300/60 font-light italic bg-white/5 rounded-2xl border border-white/10 p-3">
            No compliments yet. Be the first to leave one above! ✨
          </div>
        `;
        return;
      }

      complimentsContainer.innerHTML = compliments.map(item => `
        <div class="p-3 bg-white/10 rounded-2xl border border-white/10 shadow-sm flex flex-col gap-1 text-left transition-all hover:bg-white/15">
          <p class="text-sm text-rose-100 font-normal leading-relaxed break-words whitespace-pre-wrap">${escapeHtml(item.text)}</p>
          <div class="flex items-center justify-between text-[10px] text-pink-200/50 font-light mt-1">
            <span class="flex items-center gap-1">
              <i data-lucide="heart" class="w-2.5 h-2.5 text-rose-400 fill-rose-400"></i>
              Sweet Note
            </span>
            <span>${item.time}</span>
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 2. Update Display & Circle Meter
    function updateDisplay(val, animate) {
      if (animate) {
        counterValueEl.style.transform = 'scale(1.25)';
        setTimeout(() => {
          counterValueEl.textContent = val;
          counterValueEl.style.transform = 'scale(1)';
        }, 120);
      } else {
        counterValueEl.textContent = val;
      }

      // Loop fill gauge every 10 compliments for continuous satisfaction
      const progressRatio = val === 0 ? 0 : ((val % 10 === 0) ? 1 : (val % 10) / 10);
      const offset = CIRCUMFERENCE - (progressRatio * CIRCUMFERENCE);
      progressCircle.style.strokeDashoffset = offset;
    }

    // 3. Send Compliment
    function handleSendCompliment() {
      const text = complimentText.value.trim();
      if (!text) {
        showToast("Please write a compliment first!");
        complimentText.focus();
        return;
      }

      // Increment & Save Count
      count += 1;
      localStorage.setItem(STORAGE_KEY, count.toString());
      updateDisplay(count, true);

      // Save compliment item with timestamp
      const now = new Date();
      const timeString = now.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' +
        now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });

      compliments.unshift({ text, time: timeString });
      localStorage.setItem(COMMENTS_STORAGE_KEY, JSON.stringify(compliments));
      renderCompliments();

      // Heart Confetti Explosion
      burstLoveConfetti();

      // Clear input
      complimentText.value = '';
      charCounter.textContent = '0';
      hideToast();
    }

    // 4. Heart Confetti Burst
    function burstLoveConfetti() {
      if (typeof confetti !== 'function') return;

      try {
        // Safe and robust multi-colored love confetti burst
        confetti({
          particleCount: 35,
          spread: 70,
          origin: { y: 0.65 },
          colors: ['#f43f5e', '#fb7185', '#fda4af', '#e879f9', '#ffffff'],
          shapes: ['circle', 'square'],
          scalar: 1.2
        });

        // Complementary sparkling pop
        setTimeout(() => {
          confetti({
            particleCount: 15,
            angle: 60,
            spread: 55,
            origin: { x: 0.2, y: 0.7 },
            colors: ['#f43f5e', '#ec4899', '#c084fc']
          });
          confetti({
            particleCount: 15,
            angle: 120,
            spread: 55,
            origin: { x: 0.8, y: 0.7 },
            colors: ['#f43f5e', '#ec4899', '#c084fc']
          });
        }, 120);
      } catch (err) {
        console.warn('Confetti effect failed gracefully:', err);
      }
    }

    // 5. Reset Counter
    function confirmResetMeter() {
      if (count === 0 && compliments.length === 0) return;
      count = 0;
      compliments = [];
      localStorage.setItem(STORAGE_KEY, '0');
      localStorage.setItem(COMMENTS_STORAGE_KEY, JSON.stringify([]));
      updateDisplay(0, true);
      renderCompliments();
      showToast("Meter and compliments reset");
      setTimeout(hideToast, 2000);
    }

    // Toast helpers
    function showToast(msg) {
      toastBanner.textContent = msg;
      toastBanner.classList.remove('opacity-0');
      toastBanner.classList.add('opacity-100');
    }
    function hideToast() {
      toastBanner.classList.remove('opacity-100');
      toastBanner.classList.add('opacity-0');
    }

    // Character counter listener
    complimentText.addEventListener('input', () => {
      charCounter.textContent = complimentText.value.length;
      hideToast();
    });

    // Enter shortcut (Ctrl/Cmd + Enter)
    complimentText.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        handleSendCompliment();
      }
    });

    // 6. Floating Hearts Background Canvas
    const canvas = document.getElementById('heart-canvas');
    const ctx = canvas.getContext('2d');
    let floatingHearts = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initFloatingHearts();
    }

    function initFloatingHearts() {
      floatingHearts = [];
      const total = Math.floor(window.innerWidth / 35);
      for (let i = 0; i < total; i++) {
        floatingHearts.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 12 + 6,
          speedY: Math.random() * 0.6 + 0.3,
          speedX: (Math.random() - 0.5) * 0.4,
          opacity: Math.random() * 0.35 + 0.15,
          color: Math.random() > 0.4 ? 'rgba(244, 63, 94,' : 'rgba(251, 113, 133,'
        });
      }
    }

    function drawHeart(x, y, size, fill) {
      ctx.save();
      ctx.beginPath();
      ctx.translate(x, y);
      ctx.fillStyle = fill;
      const topCurveHeight = size * 0.3;
      ctx.moveTo(0, topCurveHeight);
      // Left curve
      ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, topCurveHeight);
      ctx.bezierCurveTo(-size / 2, (size + topCurveHeight) / 2, 0, size, 0, size * 1.3);
      // Right curve
      ctx.bezierCurveTo(0, size, size / 2, (size + topCurveHeight) / 2, size / 2, topCurveHeight);
      ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, topCurveHeight);
      ctx.fill();
      ctx.restore();
    }

    function animateHearts() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < floatingHearts.length; i++) {
        const h = floatingHearts[i];
        h.y -= h.speedY;
        h.x += h.speedX;

        // Reset to bottom if goes above screen
        if (h.y < -30) {
          h.y = canvas.height + 20;
          h.x = Math.random() * canvas.width;
        }

        drawHeart(h.x, h.y, h.size, `${h.color} ${h.opacity})`);
      }
      requestAnimationFrame(animateHearts);
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('DOMContentLoaded', () => {
      resizeCanvas();
      animateHearts();
      loadData();
    });
  </script>
</body>
</html>
